<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - DAHIRU MAN D DATA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .logout {
      border: none;
      background: #dc2626;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #6b7280;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #6b7280;
    }
  </style>
</head>

<body>

  <header>
    <h1>DAHIRU MAN D DATA</h1>

    <button class="logout" onclick="logout()">
      Logout
    </button>
  </header>

  <main>

    <section class="welcome">
      <h2>Admin Dashboard</h2>
      <p>Welcome to your DAHIRU MAN D DATA control panel.</p>
    </section>

    <section class="cards">

      <div class="card">
        <h3>Users</h3>
        <p>Manage website users.</p>
      </div>

      <div class="card">
        <h3>Wallet</h3>
        <p>View wallet activities.</p>
      </div>

      <div class="card">
        <h3>Transactions</h3>
        <p>View customer transactions.</p>
      </div>

      <div class="card">
        <h3>Services</h3>
        <p>Manage VTU services.</p>
      </div>

    </section>

  </main>

  <script>
    function logout() {
      window.location.href = '/admin';
    }
  </script>

</body>
</html>
